services:
  - type: web
    name: tuberia-pagos
    runtime: docker
    plan: free
    healthCheckPath: /tienda/lischay
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: SEED_DEMO
        value: "1"
      - key: PROCESSOR
        value: mock
